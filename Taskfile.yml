version: '3'

tasks:
  ensure-dist:
    internal: true
    cmds:
      - '{{if eq OS "windows"}}if not exist dist mkdir dist{{else}}mkdir -p dist{{end}}'

  build:
    desc: Build the native binary
    deps: [ensure-dist]
    cmds:
      - go build -o dist/patchbay .

  build-windows:
    desc: Build the Windows amd64 binary with administrator privileges
    deps: [ensure-dist, windows-resource]
    cmds:
      - go build -ldflags "-H=windowsgui {{if .VERSION}}-X main.Version={{.VERSION}}{{end}}" -o dist/patchbay-windows-amd64.exe .
    env:
      GOOS: windows
      GOARCH: amd64

  build-installer:
    desc: Build the Windows NSIS setup installer (requires makensis)
    deps: [build-windows]
    cmds:
      - makensis {{if .VERSION}}-DPRODUCT_VERSION="{{.VERSION}}"{{end}} installer.nsi
  windows-resource:
    internal: true
    cmds:
      - go run github.com/akavel/rsrc@v0.10.2 -manifest windows.manifest -ico assets/icon.ico -arch amd64 -o windows_amd64.syso

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - '{{if eq OS "windows"}}if exist dist rmdir /s /q dist{{else}}rm -rf dist{{end}}'
      - '{{if eq OS "windows"}}if exist windows_amd64.syso del /q windows_amd64.syso{{else}}rm -f windows_amd64.syso{{end}}'
