services:
  patchbay:
    image: ghcr.io/fadlee/patchbay:latest
    container_name: patchbay
    restart: unless-stopped
    # Host network mode allows Patchbay to dynamically bind and listen on any
    # host port without manually mapping ports one by one in docker-compose.
    network_mode: host
    volumes:
      - ./data:/app
    environment:
      - PATCHBAY_HOST=0.0.0.0 # Binds admin dashboard to all interfaces

    # Alternative if NOT using network_mode: host (Bridge mode):
    # ports:
    #   - "8787:8787" # Admin Dashboard
    #   - "8080:8080" # Example port forwarding
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
