name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
      - name: Extract tag version
        id: get_version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: go test ./...

      - name: Build Windows syso resource
        run: |
          go run github.com/akavel/rsrc@v0.10.2 -manifest windows.manifest -ico assets/icon.ico -arch amd64 -o windows_amd64.syso

      - name: Build Windows GUI executable
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -ldflags "-H=windowsgui -X main.Version=${{ steps.get_version.outputs.version }}" -o dist/patchbay-windows-amd64.exe .

      - name: Build NSIS Setup Installer
        run: |
          makensis -DPRODUCT_VERSION="${{ steps.get_version.outputs.version }}" installer.nsi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Patchbay ${{ steps.get_version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/patchbay-setup-amd64.exe
            dist/patchbay-windows-amd64.exe
